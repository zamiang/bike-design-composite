name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: read # Required for Claude to read CI results on PRs

jobs:
  review:
    # Only review PRs from collaborators. A fork PR from a random user must not
    # be able to spin up Claude on our subscription quota.
    if: |
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Review this pull request against the guidance in CLAUDE.md.
            Prioritize: GCP/IAM security and SA scoping, Cloud Run plus Vertex config correctness,
            Python bugs, and template structural issues. Skip stylistic nits already covered
            by ruff or djlint, and skip the `work/` directory unless something is genuinely broken.
            Post one consolidated review with inline comments where they help. Prefix
            preferential feedback with "(nit)".
